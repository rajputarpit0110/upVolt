  <!-- Tagline -->
  <text x="322" y="157" text-anchor="middle" font-family="'Inter', 'Montserrat', 'Segoe UI', sans-serif" font-size="11" font-weight="700" letter-spacing="3.8" fill="#E2E8F0">POWERING IDEAS. CONNECTING POSSIBILITIES.</text>

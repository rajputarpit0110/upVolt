<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <!-- ESP32 PCB Board -->
  <rect x="25" y="10" width="150" height="260" rx="10" fill="#0c1220" stroke="#00E5FF" stroke-width="2" />
  
  <!-- Antenna Meander Trace on top -->
  <path d="M45 25 h110 M45 35 h110 M45 45 h110 M65 25 v20 M105 25 v20 M145 25 v20" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" />
  
  <!-- Metal Shielding Can (ESP-WROOM-32) -->
  <rect x="40" y="60" width="120" height="110" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="2" />
  <rect x="45" y="65" width="110" height="100" rx="4" fill="#0f172a" />
  <text x="100" y="105" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">ESP-WROOM-32</text>
  <text x="100" y="125" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Wi-Fi + BT + BLE</text>
  <circle cx="140" cy="78" r="4" fill="#64748b" />

  <!-- Reset & Boot Buttons -->
  <rect x="35" y="190" width="18" height="18" rx="3" fill="#334155" />
  <circle cx="44" cy="199" r="5" fill="#94a3b8" />
  <text x="44" y="218" fill="#64748b" font-size="8" text-anchor="middle">EN</text>

  <rect x="147" y="190" width="18" height="18" rx="3" fill="#334155" />
  <circle cx="156" cy="199" r="5" fill="#94a3b8" />
  <text x="156" y="218" fill="#64748b" font-size="8" text-anchor="middle">BOOT</text>

  <!-- Micro USB Port at bottom -->
  <rect x="80" y="250" width="40" height="20" rx="3" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5" />
  <rect x="88" y="255" width="24" height="10" rx="1.5" fill="#0f172a" />

  <!-- Voltage Regulator & CP2102 IC -->
  <rect x="75" y="190" width="50" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="100" y="214" fill="#94a3b8" font-family="monospace" font-size="9" text-anchor="middle">CP2102</text>

  <!-- Left & Right Gold Pin Headers -->
  <g fill="#F59E0B">
    <!-- Left pins -->
    <rect x="18" y="60" width="12" height="6" rx="1"/>
    <rect x="18" y="74" width="12" height="6" rx="1"/>
    <rect x="18" y="88" width="12" height="6" rx="1"/>
    <rect x="18" y="102" width="12" height="6" rx="1"/>
    <rect x="18" y="116" width="12" height="6" rx="1"/>
    <rect x="18" y="130" width="12" height="6" rx="1"/>
    <rect x="18" y="144" width="12" height="6" rx="1"/>
    <rect x="18" y="158" width="12" height="6" rx="1"/>
    <rect x="18" y="172" width="12" height="6" rx="1"/>
    <rect x="18" y="186" width="12" height="6" rx="1"/>
    <rect x="18" y="200" width="12" height="6" rx="1"/>
    <rect x="18" y="214" width="12" height="6" rx="1"/>
    <rect x="18" y="228" width="12" height="6" rx="1"/>

    <!-- Right pins -->
    <rect x="170" y="60" width="12" height="6" rx="1"/>
    <rect x="170" y="74" width="12" height="6" rx="1"/>
    <rect x="170" y="88" width="12" height="6" rx="1"/>
    <rect x="170" y="102" width="12" height="6" rx="1"/>
    <rect x="170" y="116" width="12" height="6" rx="1"/>
    <rect x="170" y="130" width="12" height="6" rx="1"/>
    <rect x="170" y="144" width="12" height="6" rx="1"/>
    <rect x="170" y="158" width="12" height="6" rx="1"/>
    <rect x="170" y="172" width="12" height="6" rx="1"/>
    <rect x="170" y="186" width="12" height="6" rx="1"/>
    <rect x="170" y="200" width="12" height="6" rx="1"/>
    <rect x="170" y="214" width="12" height="6" rx="1"/>
    <rect x="170" y="228" width="12" height="6" rx="1"/>
  </g>
  
  <!-- LEDs -->
  <circle cx="68" cy="245" r="3" fill="#22C55E" />
  <circle cx="132" cy="245" r="3" fill="#EF4444" />
</svg>

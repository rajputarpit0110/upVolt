<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" fill="none">
  <!-- 4WD Robot Car Acrylic Chassis -->
  <rect x="40" y="40" width="180" height="120" rx="16" fill="#1E293B" stroke="#00E5FF" stroke-width="2" />
  
  <!-- Wheels with Yellow TT Motors -->
  <!-- Top Left -->
  <rect x="15" y="25" width="30" height="45" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
  <!-- Bottom Left -->
  <rect x="15" y="130" width="30" height="45" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
  <!-- Top Right -->
  <rect x="215" y="25" width="30" height="45" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />
  <!-- Bottom Right -->
  <rect x="215" y="130" width="30" height="45" rx="6" fill="#0F172A" stroke="#F59E0B" stroke-width="2" />

  <!-- Center Controller / Battery Box -->
  <rect x="80" y="65" width="100" height="70" rx="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
  <text x="130" y="98" fill="#00E5FF" font-family="'Outfit', sans-serif" font-size="12" font-weight="900" text-anchor="middle">4WD ROBOT</text>
  <text x="130" y="115" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">CHASSIS PLATFORM</text>
</svg>

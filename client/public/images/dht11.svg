<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 220" fill="none">
  <!-- DHT11 Cyan/Blue Plastic Casing -->
  <rect x="25" y="20" width="110" height="130" rx="8" fill="#0EA5E9" stroke="#38BDF8" stroke-width="2" />
  
  <!-- Louvers / Vents -->
  <g fill="#0284C7">
    <rect x="38" y="38" width="84" height="6" rx="3" />
    <rect x="38" y="52" width="84" height="6" rx="3" />
    <rect x="38" y="66" width="84" height="6" rx="3" />
    <rect x="38" y="80" width="84" height="6" rx="3" />
    <rect x="38" y="94" width="84" height="6" rx="3" />
  </g>

  <text x="80" y="125" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="14" font-weight="900" text-anchor="middle">DHT11</text>
  <text x="80" y="140" fill="#E0F2FE" font-family="'Outfit', sans-serif" font-size="8" font-weight="600" text-anchor="middle">HUMIDITY &amp; TEMP</text>

  <!-- 4 Connection Pins -->
  <g fill="#CBD5E1">
    <rect x="42" y="150" width="4" height="55" rx="1"/>
    <rect x="66" y="150" width="4" height="55" rx="1"/>
    <rect x="90" y="150" width="4" height="55" rx="1"/>
    <rect x="114" y="150" width="4" height="55" rx="1"/>
  </g>
</svg>

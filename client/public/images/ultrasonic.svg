<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" fill="none">
  <!-- Blue PCB -->
  <rect x="20" y="20" width="200" height="90" rx="8" fill="#0284C7" stroke="#38BDF8" stroke-width="2" />

  <!-- Transducer 1 (Trig / Transmitter) -->
  <circle cx="70" cy="65" r="32" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" />
  <circle cx="70" cy="65" r="26" fill="#0F172A" />
  <circle cx="70" cy="65" r="22" fill="#334155" />
  <circle cx="70" cy="65" r="10" fill="#64748B" />
  <text x="70" y="20" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">T</text>

  <!-- Transducer 2 (Echo / Receiver) -->
  <circle cx="170" cy="65" r="32" fill="#E2E8F0" stroke="#94A3B8" stroke-width="2" />
  <circle cx="170" cy="65" r="26" fill="#0F172A" />
  <circle cx="170" cy="65" r="22" fill="#334155" />
  <circle cx="170" cy="65" r="10" fill="#64748B" />
  <text x="170" y="20" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">R</text>

  <!-- Crystal & Labels -->
  <rect x="110" y="35" width="20" height="12" rx="4" fill="#CBD5E1" />
  <text x="120" y="65" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="10" font-weight="800" text-anchor="middle">HC-SR04</text>

  <!-- 4 Pins at Bottom -->
  <g fill="#F59E0B">
    <rect x="95" y="110" width="4" height="20" rx="1"/>
    <rect x="105" y="110" width="4" height="20" rx="1"/>
    <rect x="115" y="110" width="4" height="20" rx="1"/>
    <rect x="125" y="110" width="4" height="20" rx="1"/>
  </g>
  <text x="97" y="105" fill="#E0F2FE" font-size="6" text-anchor="middle">VCC</text>
  <text x="107" y="105" fill="#E0F2FE" font-size="6" text-anchor="middle">TRIG</text>
  <text x="117" y="105" fill="#E0F2FE" font-size="6" text-anchor="middle">ECHO</text>
  <text x="127" y="105" fill="#E0F2FE" font-size="6" text-anchor="middle">GND</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" fill="none">
  <!-- RFID RC522 Blue PCB -->
  <rect x="20" y="20" width="130" height="180" rx="8" fill="#1D4ED8" stroke="#60A5FA" stroke-width="2" />

  <!-- Antenna Coil Pattern -->
  <rect x="32" y="32" width="106" height="75" rx="6" stroke="#F59E0B" stroke-width="2" fill="none" />
  <rect x="38" y="38" width="94" height="63" rx="4" stroke="#F59E0B" stroke-width="1.5" fill="none" />
  <rect x="44" y="44" width="82" height="51" rx="3" stroke="#F59E0B" stroke-width="1" fill="none" />
  <circle cx="85" cy="70" r="12" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-width="1.5" />

  <!-- RC522 Chip -->
  <rect x="65" y="125" width="40" height="40" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1" />
  <text x="85" y="148" fill="#93C5FD" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="bold" text-anchor="middle">RC522</text>
  <text x="85" y="185" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="10" font-weight="bold" text-anchor="middle">13.56 MHz</text>

  <!-- Blue RFID Keyfob on the side -->
  <circle cx="190" cy="90" r="34" fill="#2563EB" stroke="#60A5FA" stroke-width="2" />
  <circle cx="190" cy="90" r="26" fill="#1E40AF" />
  <circle cx="190" cy="65" r="4" fill="#E2E8F0" />
  <path d="M185 85 h10 M180 90 h20 M185 95 h10" stroke="#93C5FD" stroke-width="2" stroke-linecap="round" />
</svg>
